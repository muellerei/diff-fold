<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="diff-fold: one summary line per file instead of the diff under a finished Claude Code edit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/></pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .diff { animation: diff 5s ease-in-out infinite; transform-box: fill-box; transform-origin: top; }
      @keyframes diff { 0%, 35% { transform: scaleY(1); opacity: 1; } 55% { transform: scaleY(0.08); opacity: 0; } 85% { transform: scaleY(0.08); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
      .line { animation: line 5s ease-in-out infinite; }
      @keyframes line { 0%, 45% { opacity: 0; } 58%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="0" fill="url(#dots)"/>
  <g transform="translate(130 138.75) scale(1.45)">
    <rect width="230" height="250" rx="22" fill="#161b22" stroke="url(#accent)" stroke-width="3"/>
    <g class="still"><rect x="20" y="22" width="150" height="8" rx="4" fill="#30363d"/><rect x="20" y="38" width="120" height="8" rx="4" fill="#f85149"/><rect x="20" y="54" width="170" height="8" rx="4" fill="#3fb950"/><rect x="20" y="70" width="136" height="8" rx="4" fill="#3fb950"/><rect x="20" y="86" width="96" height="8" rx="4" fill="#30363d"/><rect x="20" y="102" width="110" height="8" rx="4" fill="#f85149"/><rect x="20" y="118" width="160" height="8" rx="4" fill="#3fb950"/><rect x="20" y="134" width="128" height="8" rx="4" fill="#3fb950"/></g><path d="M100 160 l15 10 l15 -10" fill="none" stroke="#8b949e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="still"><text x="20" y="202" class="mono" font-size="17">🔶</text><rect x="48" y="190" width="150" height="10" rx="5" fill="url(#accent)"/></g>
  </g>
  <text x="560" y="324.0" class="mono" font-size="78" font-weight="700" fill="#e6edf3" letter-spacing="-2">diff<tspan fill="url(#accent)">-</tspan>fold</text>
  <text x="564" y="376.0" class="sans" font-size="30" fill="#c9d1d9">One line per file instead of the diff</text>
  <text x="564" y="420.0" class="sans" font-size="21" fill="#8b949e">for Claude Code · small diffs, reviews and errors stay in full</text>
</svg>
