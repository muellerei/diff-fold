name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Claude Code that breaks the mod shows up without a commit.
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The first entry is the version the mod is tested with (README, Install).
        claude-code: ['2.1.314', latest]
    name: Claude Code ${{ matrix.claude-code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - run: claude --version
      - run: claude plugin validate . --strict
      - run: claude plugin test .
      - name: Types
        env:
          # Claude Code lays down .claude-plugin/types/ only while it watches plugin folders.
          CLAUDE_CODE_PLUGIN_DIR_WATCH: '1'
        run: |
          claude --plugin-dir . -p ok || true
          npx -p typescript@5 tsc -p .
      - run: npx prettier@3 --check hooks types docs
      - run: python3 docs/src/check.py
      - name: Pictures match their scripts
        run: sh docs/src/build.sh && git diff --exit-code -- docs
